buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

// Общие версии семейства: текущие jar-ы и версии модов из ../_family (python _family/family.py sync).
if (file('../_family/family.gradle').exists()) apply from: '../_family/family.gradle'

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            jvmArg '-Dfile.encoding=UTF-8'
            // Миксины чужих модов (Kaleidoscope, LSO…) в среде разработки.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory project.file('run/client')
            property 'forge.enabledGameTestNamespaces', mod_id
            if (project.hasProperty('quickplay')) args '--quickPlayMultiplayer', project.property('quickplay')
            if (project.hasProperty('username')) args '--username', project.property('username')
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // Проверка загрузки: ./gradlew runGameTestServer — сервер стартует, гоняет тесты и выходит.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

tasks.matching { it.name == 'runServer' }.configureEach { standardInput = System.in }

// Вставка в ItemStack.getMaxStackSize — стак ингредиентов по весу (core/Weights).
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    // RP Core и соседи по семейству — jar в libs/.
    flatDir { dir 'libs' }
    // Моды сборки для проверки совместимости (-Pwith_pack=true): Kaleidoscope, Farmer's Delight…
    flatDir { dir 'libs/pack' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

def flag = { String name -> (project.findProperty(name) ?: 'false').toString().toBoolean() }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // RP Core — обязательная зависимость: API питания, тела, навыков; общий HUD.
    implementation fg.deobf("blank:rpcore:${rpcore_version}")
    // LSO — необязательный: вода берётся из него. Код интеграции загружается, только если он стоит.
    compileOnly fg.deobf("maven.modrinth:legendary-survival-overhaul:${lso_version}")

    // Проверка вместе с семьёй: -Pwith_medicine=true, -Pwith_perks=true, -Pwith_stamina=true (или -Pwith_family=true — все).
    boolean family = flag('with_family')
    if (family || flag('with_medicine')) runtimeOnly fg.deobf("blank:rpmedicine:${rpmedicine_version}")
    if (family || flag('with_perks')) runtimeOnly fg.deobf("blank:rpperks:${rpperks_version}")
    if (family || flag('with_stamina')) runtimeOnly fg.deobf("blank:rpstamina:${rpstamina_version}")
    if (flag('with_lso')) runtimeOnly fg.deobf("maven.modrinth:legendary-survival-overhaul:${lso_version}")
    // Моды готовки из сборки (-Pwith_pack=true): jar кладутся в libs/pack как <имя>-1.jar.
    if (flag('with_pack')) {
        fileTree('libs/pack').matching { include '*-1.jar' }.each { f ->
            runtimeOnly fg.deobf("blank:${f.name.replace('-1.jar', '')}:1")
        }
    }

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
    jvmArgs '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // В сборку для игроков не идут игровые тесты и их площадка (ревью 11.10, п. 4).
    exclude 'faygolover/rpculinary/gametest/**', 'data/rpculinary/structures/**'

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
